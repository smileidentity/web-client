name: lint
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      - name: restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json', '.npmrc') }}
          path: |
            node_modules
            packages/*/node_modules
            !node_modules/.cache
      - name: install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: lint
        run: npx prettier --check .
      - name: version consistency
        run: node ./scripts/versionConsistency.js
      - name: locale parity
        run: node ./scripts/checkLocaleParity.js
      - name: Check Dependency Versions
        run: npm exec check-dependency-version-consistency || true
  web-components:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/web-components
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      - name: restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json', '.npmrc') }}
          path: |
            node_modules
            packages/*/node_modules
            !node_modules/.cache
      - name: install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: lint
        run: npm run lint
  smart-camera-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/smart-camera-web
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      - name: restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json', '.npmrc') }}
          path: |
            node_modules
            packages/*/node_modules
            !node_modules/.cache
      - name: install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: lint
        run: npm run lint
  embed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/embed
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      - name: restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json', '.npmrc') }}
          path: |
            node_modules
            packages/*/node_modules
            !node_modules/.cache
      - name: install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: lint html
        run: npm run lint:html
