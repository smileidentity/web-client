name: test
on:
  workflow_call:
jobs:
  smart-camera-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/smart-camera-web
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      - name: install dependencies
        run: npm ci
      - name: build application
        run: npm run build
      - name: run tests
        uses: cypress-io/github-action@bc982daf1fc26474fa0cf2c355d6c910616ce411 # v6
        with:
          install: false
          start: npm start
          working-directory: ./packages/smart-camera-web
          wait-on: 'http://localhost:8000'
  embed:
    needs: [web-components]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/embed
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      - name: build web-components dependency
        run: |
          cd ../web-components
          npm ci
          npm run build
      - name: install dependencies
        run: npm ci
      - name: run tests
        uses: cypress-io/github-action@bc982daf1fc26474fa0cf2c355d6c910616ce411 # v6
        with:
          install: false
          start: npm start
          working-directory: ./packages/embed
          wait-on: 'http://localhost:8000'
      - name: upload test failure artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
  web-components:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/web-components
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      - name: install dependencies
        run: npm ci
      - name: build application
        run: npm run build
      - name: run tests
        uses: cypress-io/github-action@bc982daf1fc26474fa0cf2c355d6c910616ce411 # v6
        with:
          install: false
          start: npm run dev
          working-directory: ./packages/web-components
          wait-on: 'http://localhost:3005'
      - name: upload test failure artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
